---
# Per environment values which override defaults in hmpps-probation-check-in-ui/values.yaml

generic-service:
  ingress:
    host: probation-check-in.hmpps.service.justice.gov.uk
    className: modsec
    modsecurity_snippet: |
      SecRuleEngine On
      SecAuditEngine RelevantOnly
      SecRequestBodyAccess On
      # Disable CRS RCE rules (932230/932250) due to false positives on free-text answers
      # Scoped to question pages and the named answer fields
      SecRule REQUEST_URI "@rx ^/[^/]+/questions/(mental-health|assistance|additional/\d+)$" \
          "id:1000001,\
          phase:1,\
          pass,\
          nolog,\
          ctl:ruleRemoveTargetById=932230;ARGS:mentalHealthVeryWell,\
          ctl:ruleRemoveTargetById=932230;ARGS:mentalHealthWell,\
          ctl:ruleRemoveTargetById=932230;ARGS:mentalHealthOk,\
          ctl:ruleRemoveTargetById=932230;ARGS:mentalHealthNotGreat,\
          ctl:ruleRemoveTargetById=932230;ARGS:mentalHealthStruggling,\
          ctl:ruleRemoveTargetById=932230;ARGS:mentalHealthSupport,\
          ctl:ruleRemoveTargetById=932230;ARGS:alcoholSupport,\
          ctl:ruleRemoveTargetById=932230;ARGS:drugsSupport,\
          ctl:ruleRemoveTargetById=932230;ARGS:moneySupport,\
          ctl:ruleRemoveTargetById=932230;ARGS:housingSupport,\
          ctl:ruleRemoveTargetById=932230;ARGS:employmentEduSupport,\
          ctl:ruleRemoveTargetById=932230;ARGS:supportSystemSupport,\
          ctl:ruleRemoveTargetById=932230;ARGS:otherSupport,\
          ctl:ruleRemoveTargetById=932230;ARGS:additionalAnswer,\
          ctl:ruleRemoveTargetById=932250;ARGS:mentalHealthVeryWell,\
          ctl:ruleRemoveTargetById=932250;ARGS:mentalHealthWell,\
          ctl:ruleRemoveTargetById=932250;ARGS:mentalHealthOk,\
          ctl:ruleRemoveTargetById=932250;ARGS:mentalHealthNotGreat,\
          ctl:ruleRemoveTargetById=932250;ARGS:mentalHealthStruggling,\
          ctl:ruleRemoveTargetById=932250;ARGS:mentalHealthSupport,\
          ctl:ruleRemoveTargetById=932250;ARGS:alcoholSupport,\
          ctl:ruleRemoveTargetById=932250;ARGS:drugsSupport,\
          ctl:ruleRemoveTargetById=932250;ARGS:moneySupport,\
          ctl:ruleRemoveTargetById=932250;ARGS:housingSupport,\
          ctl:ruleRemoveTargetById=932250;ARGS:employmentEduSupport,\
          ctl:ruleRemoveTargetById=932250;ARGS:supportSystemSupport,\
          ctl:ruleRemoveTargetById=932250;ARGS:otherSupport,\
          ctl:ruleRemoveTargetById=932250;ARGS:additionalAnswer"
      SecDefaultAction "phase:2,pass,log,tag:github_team=stg-pathfinders,tag:namespace={{ .Release.Namespace }}"

  env:
    INGRESS_URL: "https://probation-check-in.hmpps.service.justice.gov.uk"
    HMPPS_AUTH_URL: "https://sign-in.hmpps.service.justice.gov.uk/auth"
    TOKEN_VERIFICATION_API_URL: "https://token-verification-api.prison.service.justice.gov.uk"
    ESUPERVISION_API_URL: 'https://esupervision-api.hmpps.service.justice.gov.uk'
    AUDIT_ENABLED: "false"
    FEATURE_FACE_LIVENESS: 'true'

generic-prometheus-alerts:
  alertSeverity: hmpps_esupervision_alerts
