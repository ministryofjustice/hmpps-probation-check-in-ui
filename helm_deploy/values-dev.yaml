---
# Per environment values which override defaults in hmpps-probation-check-in-ui/values.yaml

generic-service:
  replicaCount: 2

  ingress:
    host: probation-check-in-dev.hmpps.service.justice.gov.uk
    className: modsec-non-prod
    modsecurity_snippet: |
      SecRuleEngine On
      SecAuditEngine RelevantOnly
      SecRequestBodyAccess On
      # Disable the OWASP CRS attack-rce rule category (accuracy/maturity 0 heuristics prone to false positives on prose) for known free-text answer fields
      # Scoped to question pages and the named answer fields
      SecRule REQUEST_FILENAME "@rx ^/[^/]+/questions/(mental-health|assistance|additional/\d+)$" \
          "id:1000001,\
          phase:1,\
          pass,\
          nolog,\
          ctl:ruleRemoveTargetByTag=attack-rce;ARGS:mentalHealthVeryWell,\
          ctl:ruleRemoveTargetByTag=attack-rce;ARGS:mentalHealthWell,\
          ctl:ruleRemoveTargetByTag=attack-rce;ARGS:mentalHealthOk,\
          ctl:ruleRemoveTargetByTag=attack-rce;ARGS:mentalHealthNotGreat,\
          ctl:ruleRemoveTargetByTag=attack-rce;ARGS:mentalHealthStruggling,\
          ctl:ruleRemoveTargetByTag=attack-rce;ARGS:mentalHealthSupport,\
          ctl:ruleRemoveTargetByTag=attack-rce;ARGS:alcoholSupport,\
          ctl:ruleRemoveTargetByTag=attack-rce;ARGS:drugsSupport,\
          ctl:ruleRemoveTargetByTag=attack-rce;ARGS:moneySupport,\
          ctl:ruleRemoveTargetByTag=attack-rce;ARGS:housingSupport,\
          ctl:ruleRemoveTargetByTag=attack-rce;ARGS:employmentEduSupport,\
          ctl:ruleRemoveTargetByTag=attack-rce;ARGS:supportSystemSupport,\
          ctl:ruleRemoveTargetByTag=attack-rce;ARGS:otherSupport,\
          ctl:ruleRemoveTargetByTag=attack-rce;ARGS:additionalAnswer"
      SecDefaultAction "phase:2,pass,log,tag:github_team=stg-pathfinders,tag:namespace={{ .Release.Namespace }}"

  env:
    INGRESS_URL: 'https://probation-check-in-dev.hmpps.service.justice.gov.uk'
    HMPPS_AUTH_URL: 'https://sign-in-dev.hmpps.service.justice.gov.uk/auth'
    TOKEN_VERIFICATION_API_URL: 'https://token-verification-api-dev.prison.service.justice.gov.uk'
    ESUPERVISION_API_URL: 'https://esupervision-api-dev.hmpps.service.justice.gov.uk'
    ENVIRONMENT_NAME: DEV
    AUDIT_ENABLED: 'false'
    FEATURE_FACE_LIVENESS: 'true'

generic-prometheus-alerts:
  alertSeverity: hmpps_esupervision_alerts_nonprod
